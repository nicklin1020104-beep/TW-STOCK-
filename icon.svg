<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2430"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 網格 -->
  <g stroke="#2c3240" stroke-width="4">
    <line x1="72" y1="150" x2="440" y2="150"/>
    <line x1="72" y1="240" x2="440" y2="240"/>
    <line x1="72" y1="330" x2="440" y2="330"/>
  </g>
  <!-- K 棒：一根綠（跌）三根紅（漲），越來越高 -->
  <g stroke-linecap="round">
    <line x1="128" y1="236" x2="128" y2="352" stroke="#22b35e" stroke-width="10"/>
    <rect x="104" y="258" width="48" height="72" rx="8" fill="#22b35e"/>
    <line x1="208" y1="226" x2="208" y2="350" stroke="#ff4d4f" stroke-width="10"/>
    <rect x="184" y="250" width="48" height="84" rx="8" fill="#ff4d4f"/>
    <line x1="288" y1="166" x2="288" y2="320" stroke="#ff4d4f" stroke-width="10"/>
    <rect x="264" y="190" width="48" height="108" rx="8" fill="#ff4d4f"/>
    <line x1="368" y1="96" x2="368" y2="270" stroke="#ff4d4f" stroke-width="10"/>
    <rect x="344" y="120" width="48" height="128" rx="8" fill="#ff4d4f"/>
  </g>
  <!-- 上升趨勢線 -->
  <polyline points="96,318 184,282 272,214 352,148 420,104" fill="none" stroke="#ffd166" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420" cy="104" r="14" fill="#ffd166"/>
  <!-- 文字 -->
  <text x="256" y="446" text-anchor="middle" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="6">收盤達人</text>
</svg>
