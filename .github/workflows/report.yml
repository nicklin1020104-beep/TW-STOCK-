# 每日報告（台灣時間；六日不跑）
#   13:35、13:55 收盤快報：用即時行情（正式資料還沒出來時），約 14:00 前上線；推播同一天只發一次
#   17:00 補上三大法人；08:35 補晚出的資料
name: 每日報告
on:
  schedule:
    - cron: '35 5 * * 1-5'  # 13:35 台灣（GitHub 常晚 10～20 分鐘，實際約 13:45～14:00）
    - cron: '55 5 * * 1-5'  # 13:55 台灣（備援）
    - cron: '0 9 * * 1-5'   # 17:00 台灣（三大法人）
    - cron: '35 0 * * 1-5'  # 08:35 台灣（平日；六日不更新）
  workflow_dispatch:
    inputs:
      mode:
        description: 'close＝收盤快報'
        required: false
        default: ''
  push:   # 手動測試：改動這個檔案就會執行
    branches: [main]
    paths: ['.github/run-report']
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { ref: bot, path: bot }
      - uses: actions/checkout@v4
        with: { ref: main, path: bot/site }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 產生報告
        working-directory: bot
        env:
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
          WAIT_TODAY: ${{ (github.event.schedule == '35 5 * * 1-5' || github.event.schedule == '55 5 * * 1-5') && '1' || '' }}
          FAST_CLOSE: ${{ inputs.mode == 'close' && '1' || '' }}
        run: node screener.js
      - name: 發布網站
        working-directory: bot/site
        run: |
          git config user.name "飆股情報局 bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -qm "update $(TZ=Asia/Taipei date +%F)" && git pull -q --rebase && git push -q)
      - name: 推播通知（只有正式排程會推）
        if: github.event_name == 'schedule' || inputs.mode == 'close'
        working-directory: bot
        env:
          RESULTS_KEY: ${{ secrets.RESULTS_KEY }}
        run: |
          sleep 60
          node notify-report.js
      - name: 保存資料
        if: always()
        working-directory: bot
        run: |
          git config user.name "飆股情報局 bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -qm "data $(TZ=Asia/Taipei date +%F)" && git pull -q --rebase && git push -q)
